name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install

      - name: Generate Chime & Verify Audio Assets
        run: |
          node scripts/generate-chime.js
          if [ ! -f "android/app/src/main/res/raw/single_ring.wav" ]; then
            echo "Error: single_ring.wav missing in android/app/src/main/res/raw/"
            exit 1
          fi
          echo "Audio chime verified at android/app/src/main/res/raw/single_ring.wav"

      - name: Build Web App & Sync Capacitor
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npm run build
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK & Ensure Public Visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./satkin-pacer.apk
          gh repo edit --visibility public --accept-visibility-change-consequences || echo "Repository visibility already public or requires manual toggle."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: satkin-rotation-apk
          path: ./satkin-pacer.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "📱 Satkin Pacer APK - Build #${{ github.run_number }}"
          files: ./satkin-pacer.apk
          body: |
            ### 📱 Satkin Rotation & Habit Pacer APK
            
            **Direct Download Link:**
            [Download Satkin Pacer APK](https://github.com/${{ github.repository }}/releases/latest/download/satkin-pacer.apk)
            
            ### 📷 Scan with Phone Camera to Install:
            ![Scan to Install](https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://github.com/${{ github.repository }}/releases/latest/download/satkin-pacer.apk)

      - name: Display QR Code in Job Summary
        run: |
          echo "### 📱 Download Satkin Pacer APK (Build #${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Direct Link:** [Download satkin-pacer.apk](https://github.com/${{ github.repository }}/releases/latest/download/satkin-pacer.apk)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📷 Scan with Phone Camera to Install:" >> $GITHUB_STEP_SUMMARY
          echo "![Scan to Install](https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://github.com/${{ github.repository }}/releases/latest/download/satkin-pacer.apk)" >> $GITHUB_STEP_SUMMARY
