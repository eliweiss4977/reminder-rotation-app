name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install

      - name: Generate Chime & Verify Audio Assets
        run: |
          node scripts/generate-chime.js
          if [ ! -f "android/app/src/main/res/raw/single_ring.wav" ]; then
            echo "Error: single_ring.wav missing in android/app/src/main/res/raw/"
            exit 1
          fi
          echo "Audio chime verified at android/app/src/main/res/raw/single_ring.wav"

      - name: Build Web App & Sync Capacitor
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npm run build
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android APK and Play Store AAB Bundle
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing secret detected: Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
            export KEYSTORE_PATH="upload-keystore.jks"
          else
            echo "Using repository release keystore (app/release.keystore)..."
            export KEYSTORE_PATH="release.keystore"
          fi
          ./gradlew clean bundleRelease assembleRelease assembleDebug --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab ../rotation-reminder-release.aab
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../rotation-reminder.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ../rotation-reminder.apk
          fi

      - name: Ensure Repository Public Visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo edit --visibility public --accept-visibility-change-consequences || echo "Repository visibility already public or requires manual toggle."

      - name: Upload Build Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: rotation-reminder-packages
          path: |
            ./rotation-reminder.apk
            ./rotation-reminder-release.aab
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "📱 Rotation Reminder APK & Play Store AAB - Build #${{ github.run_number }}"
          files: |
            ./rotation-reminder.apk
            ./rotation-reminder-release.aab
          body: |
            ### 📱 Rotation Reminder v1.0.${{ github.run_number }}
            
            **Direct APK Download Link (Install on Phone / Tablet):**
            👉 **[Download rotation-reminder.apk](https://github.com/${{ github.repository }}/releases/latest/download/rotation-reminder.apk)**
            
            *(Note: If Android prompts "File might be harmful" or "Unrecognized app", tap **Download anyway** and **Install anyway**.)*
            
            ---
            
            **Google Play Console Store Bundle (Developers Only):**
            📦 [Download rotation-reminder-release.aab](https://github.com/${{ github.repository }}/releases/latest/download/rotation-reminder-release.aab)  
            *(Note: The `.aab` file cannot be opened directly on phones; use the `.apk` file above for direct installation.)*
            
            ---
            
            ### 📷 Scan with Phone Camera to Install APK:
            ![Scan to Install](https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://github.com/${{ github.repository }}/releases/latest/download/rotation-reminder.apk)

      - name: Display QR Code in Job Summary
        run: |
          echo "### 📱 Download Rotation Reminder (Build #${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Direct APK Link:** [Download rotation-reminder.apk](https://github.com/${{ github.repository }}/releases/latest/download/rotation-reminder.apk)" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Google Play AAB Link:** [Download rotation-reminder-release.aab](https://github.com/${{ github.repository }}/releases/latest/download/rotation-reminder-release.aab)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📷 Scan with Phone Camera to Install APK:" >> $GITHUB_STEP_SUMMARY
          echo "![Scan to Install](https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://github.com/${{ github.repository }}/releases/latest/download/rotation-reminder.apk)" >> $GITHUB_STEP_SUMMARY
