apply plugin: 'com.android.application'

android {
    namespace = "com.rotationreminder.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.rotationreminder.app"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        def runNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "1"
        versionCode Integer.parseInt(runNumber)
        versionName "1.0." + runNumber
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH") ?: "release.keystore"
            storeFile file(ksPath)
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "rotationreminder"
            keyAlias System.getenv("KEY_ALIAS") ?: "rotationreminder"
            keyPassword System.getenv("KEY_PASSWORD") ?: "rotationreminder"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.wear:wear:1.3.0"
    implementation "androidx.wear.tiles:tiles:1.4.1"
    implementation "androidx.wear.protolayout:protolayout:1.2.1"
    implementation "androidx.wear.protolayout:protolayout-material:1.2.1"
    implementation "androidx.wear.protolayout:protolayout-expression:1.2.1"
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
    implementation "com.google.guava:guava:33.3.1-android"
    implementation "androidx.concurrent:concurrent-futures:1.2.0"
}
